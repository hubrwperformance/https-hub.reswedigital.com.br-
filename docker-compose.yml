services:
  site:
    build: .
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.site-reswe.rule=Host(`site.reswedigital.com.br`)
      - traefik.http.routers.site-reswe.entrypoints=websecure
      - traefik.http.routers.site-reswe.tls.certresolver=letsencrypt
      - traefik.http.services.site-reswe.loadbalancer.server.port=80
      - traefik.http.routers.site-reswe-http.rule=Host(`site.reswedigital.com.br`)
      - traefik.http.routers.site-reswe-http.entrypoints=web
      - traefik.http.routers.site-reswe-http.middlewares=site-reswe-https
      - traefik.http.middlewares.site-reswe-https.redirectscheme.scheme=https
